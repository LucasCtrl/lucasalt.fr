---
title: 'Home'
published: true
---

<div class="post-list">
  {% assign posts_by_date = posts | sort: 'publishDate' | reverse %}
  {% for post in posts_by_date %}
  <div>
    <a href="posts/{{ post.uri }}">{{ post.title}}</a>
    <p>{{ post.publishDate }}</p>
  </div>
  {% endfor %}
</div>
